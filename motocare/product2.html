<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Section UI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#f5f5f5;
      padding:40px;
    }

    .section{
      margin-bottom:60px;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      flex-wrap:wrap;
      gap:10px;
    }

    .section-title{
      font-size:28px;
      font-weight:bold;
    }

    .filter-group{
      display:flex;
      gap:10px;
    }

    .filter-btn{
      padding:10px 16px;
      border:none;
      border-radius:8px;
      background:white;
      cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
      transition:0.2s;
    }

    .filter-btn:hover{
      background:black;
      color:white;
    }

    .filter-btn.active{
      background:black;
      color:white;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .card{
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .image{
      height:180px;
      background:#ddd;
    }

    .content{
      padding:16px;
    }

    .name{
      font-size:18px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .price{
      color:red;
      font-weight:bold;
      margin-bottom:10px;
    }

    .tag{
      display:inline-block;
      padding:6px 10px;
      background:#eee;
      border-radius:20px;
      font-size:13px;
    }

    .pagination{
      margin-top:25px;
      display:flex;
      justify-content:center;
      gap:10px;
    }

    .pagination button{
      width:40px;
      height:40px;
      border:none;
      border-radius:8px;
      background:white;
      cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .pagination button.active{
      background:black;
      color:white;
    }

    @media(max-width:992px){
      .grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .grid{
        grid-template-columns:1fr;
      }

      .top-bar{
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- NHỚT -->
  <section class="section">

    <div class="top-bar">
      <h2 class="section-title">Nhớt</h2>

      <div class="filter-group">
        <button class="filter-btn active">Tất cả</button>
        <button class="filter-btn">Motul</button>
        <button class="filter-btn">Castrol</button>
        <button class="filter-btn">Repsol</button>
      </div>
    </div>

    <div class="grid">

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">Motul 300V</div>
          <div class="price">320.000đ</div>
          <div class="tag">Motul</div>
        </div>
      </div>

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">Castrol Power1</div>
          <div class="price">250.000đ</div>
          <div class="tag">Castrol</div>
        </div>
      </div>

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">Repsol Racing</div>
          <div class="price">350.000đ</div>
          <div class="tag">Repsol</div>
        </div>
      </div>

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">Motul Scooter</div>
          <div class="price">280.000đ</div>
          <div class="tag">Motul</div>
        </div>
      </div>

    </div>

    <div class="pagination">
      <button><</button>
      <button class="active">1</button>
      <button>2</button>
      <button>3</button>
      <button>></button>
    </div>

  </section>

  <!-- LỐP -->
  <section class="section">

    <div class="top-bar">
      <h2 class="section-title">Lốp</h2>

      <div class="filter-group">
        <button class="filter-btn active">Tất cả</button>
        <button class="filter-btn">Michelin</button>
        <button class="filter-btn">IRC</button>
        <button class="filter-btn">Dunlop</button>
      </div>
    </div>

    <div class="grid">

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">Michelin City Grip</div>
          <div class="price">950.000đ</div>
          <div class="tag">Michelin</div>
        </div>
      </div>

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">IRC NR77</div>
          <div class="price">720.000đ</div>
          <div class="tag">IRC</div>
        </div>
      </div>

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">Dunlop D102</div>
          <div class="price">850.000đ</div>
          <div class="tag">Dunlop</div>
        </div>
      </div>

      <div class="card">
        <div class="image"></div>

        <div class="content">
          <div class="name">Michelin Pilot</div>
          <div class="price">1.200.000đ</div>
          <div class="tag">Michelin</div>
        </div>
      </div>

    </div>

    <div class="pagination">
      <button><</button>
      <button class="active">1</button>
      <button>2</button>
      <button>3</button>
      <button>></button>
    </div>

  </section>

</body>
</html>
